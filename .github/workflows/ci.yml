name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  analyze_and_test:
    name: Analyze, format and unit test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos

      # Integration tests hit the VeChain testnet and run locally in
      # scripts/pre_commit, so CI only runs the offline unit tests.
      - name: Run unit tests with coverage
        if: hashFiles('test/src/**/*_test.dart') != ''
        run: flutter test test/src --coverage

      - name: Upload coverage
        if: hashFiles('coverage/lcov.info') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov.info
          